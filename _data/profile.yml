description: >-
  Postdoctoral scholar at Stanford and creator of KomaMRI. I turn MRI physics into fast, open-source tools for simulation, sequence design, and reconstruction.
role: Postdoctoral Scholar
institution: Stanford University
bio:
  - >-
    I am a postdoctoral scholar at Stanford working at the intersection of mathematics, physics, computing, and medical imaging. I develop high-performance, open-source methods that turn first-principles MRI models into practical tools for simulation, sequence design, and image reconstruction. My current research uses compiler technology and AI to build efficient, physically consistent methods for medical imaging.
