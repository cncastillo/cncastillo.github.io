bio:
  - >-
    I am a postdoctoral scholar at Stanford working at the intersection of mathematics, physics, computing, and medical imaging. My goal is to automate MRI discovery for better patient care. I envision AI systems learning through simulation and scanner validation. My current research combines differentiable physics and compilers for fast, accurate, open-source MRI simulation on ML accelerators, supporting sequence design and reconstruction.
