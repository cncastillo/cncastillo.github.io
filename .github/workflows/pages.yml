name: Build PDFs and website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Keep Ruby 3.3 from restarting with the macOS lockfile's Bundler 1.x.
      BUNDLER_VERSION: '2.5.23'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: '3.10'
      - name: Validate content and generate CV records
        run: |
          ruby scripts/test-content.rb
          ruby scripts/test-cv.rb
          ruby scripts/test-course-sharing.rb
      - name: Compile CV
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: cv.tex
          working_directory: _cv
          texlive_version: 2025
          args: -pdf -no-shell-escape -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build -jobname=carlos-castillo-passi-cv
      - name: Include the freshly built CV in the site
        run: cp _cv/build/carlos-castillo-passi-cv.pdf assets/cv/carlos-castillo-passi-cv.pdf
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5
        with:
          typst-version: '0.15.0'
      - name: Build syllabus PDF with Pandoc and Typst
        run: bash scripts/build-syllabus-pdf.sh
      - name: Build website
        run: bundle exec jekyll build --safe
        env:
          JEKYLL_ENV: production
      - name: Upload CV preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carlos-castillo-passi-cv
          path: assets/cv/carlos-castillo-passi-cv.pdf
          if-no-files-found: error
      - name: Upload syllabus preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bios-214-syllabus
          path: assets/teaching/bios-214-syllabus.pdf
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
