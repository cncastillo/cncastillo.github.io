<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}{{ site.data.profile.name | escape }}{% else %}{{ page.title | escape }} · {{ site.data.profile.name | escape }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.data.profile.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ site.data.profile.favicon | relative_url }}" type="image/png" sizes="128x128">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      {% include site-header.html %}
      <main id="content">
        {{ content }}
      </main>
      {% include site-footer.html %}
    </div>
  </body>
</html>
